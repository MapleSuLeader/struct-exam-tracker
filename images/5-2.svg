<svg viewBox="0 0 520 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 题2：简支梁 l=12m，截面C在a=4m处 -->
  <text x="260" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">题2：简支梁弯矩影响线</text>
  
  <!-- 梁 -->
  <line x1="60" y1="80" x2="460" y2="80" stroke="#334155" stroke-width="3"/>
  
  <!-- A支座 -->
  <polygon points="60,80 48,102 72,102" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="42" y1="105" x2="78" y2="105" stroke="#334155" stroke-width="2"/>
  <line x1="46" y1="105" x2="42" y2="112" stroke="#334155" stroke-width="1.2"/>
  <line x1="54" y1="105" x2="50" y2="112" stroke="#334155" stroke-width="1.2"/>
  <line x1="62" y1="105" x2="58" y2="112" stroke="#334155" stroke-width="1.2"/>
  <line x1="70" y1="105" x2="66" y2="112" stroke="#334155" stroke-width="1.2"/>
  <line x1="78" y1="105" x2="74" y2="112" stroke="#334155" stroke-width="1.2"/>
  <text x="60" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">A</text>
  
  <!-- B支座 -->
  <polygon points="460,80 448,102 472,102" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="460" cy="105" r="3" fill="white" stroke="#334155" stroke-width="1.5"/>
  <line x1="442" y1="108" x2="478" y2="108" stroke="#334155" stroke-width="2"/>
  <line x1="446" y1="108" x2="442" y2="115" stroke="#334155" stroke-width="1.2"/>
  <line x1="454" y1="108" x2="450" y2="115" stroke="#334155" stroke-width="1.2"/>
  <line x1="462" y1="108" x2="458" y2="115" stroke="#334155" stroke-width="1.2"/>
  <line x1="470" y1="108" x2="466" y2="115" stroke="#334155" stroke-width="1.2"/>
  <line x1="478" y1="108" x2="474" y2="115" stroke="#334155" stroke-width="1.2"/>
  <text x="460" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">B</text>
  
  <!-- 截面C标记 -->
  <line x1="193" y1="68" x2="193" y2="92" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,2"/>
  <text x="193" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#f59e0b">C</text>
  
  <!-- 尺寸标注 -->
  <line x1="60" y1="148" x2="193" y2="148" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="60" y1="142" x2="60" y2="154" stroke="#3b82f6" stroke-width="1"/>
  <line x1="193" y1="142" x2="193" y2="154" stroke="#3b82f6" stroke-width="1"/>
  <text x="126" y="164" text-anchor="middle" font-size="11" fill="#3b82f6">a = 4m</text>
  
  <line x1="193" y1="148" x2="460" y2="148" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="460" y1="142" x2="460" y2="154" stroke="#8b5cf6" stroke-width="1"/>
  <text x="326" y="164" text-anchor="middle" font-size="11" fill="#8b5cf6">b = 8m</text>
  
  <!-- 影响线图形 -->
  <text x="260" y="186" text-anchor="middle" font-size="12" font-weight="600" fill="#4f46e5">M<tspan font-size="9" dy="2">C</tspan><tspan dy="-2"> 影响线</tspan></text>
  
  <!-- 基线 -->
  <line x1="60" y1="230" x2="460" y2="230" stroke="#94a3b8" stroke-width="1"/>
  
  <!-- 三角形影响线 -->
  <polygon points="60,230 193,195 460,230" fill="rgba(79,70,229,0.12)" stroke="#4f46e5" stroke-width="2"/>
  
  <!-- 顶点标注 -->
  <line x1="193" y1="195" x2="193" y2="230" stroke="#4f46e5" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="210" y="210" font-size="11" font-weight="600" fill="#4f46e5">y<tspan font-size="8" dy="2">C</tspan><tspan dy="-2"> = 8/3 m</tspan></text>
  
  <!-- 均布荷载示意 -->
  <line x1="70" y1="40" x2="70" y2="68" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="70,68 67,61 73,61" fill="#ef4444"/>
  <line x1="110" y1="40" x2="110" y2="68" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="110,68 107,61 113,61" fill="#ef4444"/>
  <line x1="150" y1="40" x2="150" y2="68" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="150,68 147,61 153,61" fill="#ef4444"/>
  <line x1="190" y1="40" x2="190" y2="68" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="190,68 187,61 193,61" fill="#ef4444"/>
  <line x1="230" y1="40" x2="230" y2="68" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="230,68 227,61 233,61" fill="#ef4444"/>
  <line x1="270" y1="40" x2="270" y2="68" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="270,68 267,61 273,61" fill="#ef4444"/>
  <line x1="310" y1="40" x2="310" y2="68" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="310,68 307,61 313,61" fill="#ef4444"/>
  <line x1="350" y1="40" x2="350" y2="68" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="350,68 347,61 353,61" fill="#ef4444"/>
  <line x1="390" y1="40" x2="390" y2="68" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="390,68 387,61 393,61" fill="#ef4444"/>
  <line x1="430" y1="40" x2="430" y2="68" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="430,68 427,61 433,61" fill="#ef4444"/>
  <!-- 均布荷载连线 -->
  <line x1="60" y1="40" x2="440" y2="40" stroke="#ef4444" stroke-width="1.5"/>
  <text x="250" y="35" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">q = 10kN/m（可任意布置）</text>
</svg>
