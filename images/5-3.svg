<svg viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 题3：机动法作影响线 -->
  <text x="260" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">题3：机动法作影响线（l=8m，C为跨中）</text>
  
  <!-- (a) 原结构 -->
  <text x="130" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">(a) 原结构</text>
  <line x1="30" y1="70" x2="230" y2="70" stroke="#334155" stroke-width="3"/>
  <!-- A支座 -->
  <polygon points="30,70 18,92 42,92" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="12" y1="95" x2="48" y2="95" stroke="#334155" stroke-width="2"/>
  <line x1="16" y1="95" x2="12" y2="102" stroke="#334155" stroke-width="1.2"/>
  <line x1="24" y1="95" x2="20" y2="102" stroke="#334155" stroke-width="1.2"/>
  <line x1="32" y1="95" x2="28" y2="102" stroke="#334155" stroke-width="1.2"/>
  <line x1="40" y1="95" x2="36" y2="102" stroke="#334155" stroke-width="1.2"/>
  <line x1="48" y1="95" x2="44" y2="102" stroke="#334155" stroke-width="1.2"/>
  <text x="30" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">A</text>
  <!-- B支座 -->
  <polygon points="230,70 218,92 242,92" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="230" cy="95" r="3" fill="white" stroke="#334155" stroke-width="1.5"/>
  <line x1="212" y1="98" x2="248" y2="98" stroke="#334155" stroke-width="2"/>
  <line x1="216" y1="98" x2="212" y2="105" stroke="#334155" stroke-width="1.2"/>
  <line x1="224" y1="98" x2="220" y2="105" stroke="#334155" stroke-width="1.2"/>
  <line x1="232" y1="98" x2="228" y2="105" stroke="#334155" stroke-width="1.2"/>
  <line x1="240" y1="98" x2="236" y2="105" stroke="#334155" stroke-width="1.2"/>
  <line x1="248" y1="98" x2="244" y2="105" stroke="#334155" stroke-width="1.2"/>
  <text x="230" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">B</text>
  <!-- C点 -->
  <circle cx="130" cy="70" r="4" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#f59e0b">C</text>
  <!-- 尺寸 -->
  <line x1="30" y1="130" x2="230" y2="130" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="30" y1="124" x2="30" y2="136" stroke="#64748b" stroke-width="1"/>
  <line x1="230" y1="124" x2="230" y2="136" stroke="#64748b" stroke-width="1"/>
  <text x="130" y="146" text-anchor="middle" font-size="11" fill="#64748b">l = 8m</text>
  
  <!-- (b) MC影响线 - 撤抗弯约束 -->
  <text x="390" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">(b) M<tspan font-size="9" dy="2">C</tspan><tspan dy="-2"> 影响线</tspan></text>
  <line x1="290" y1="70" x2="385" y2="48" stroke="#4f46e5" stroke-width="2.5"/>
  <line x1="395" y1="48" x2="490" y2="70" stroke="#4f46e5" stroke-width="2.5"/>
  <!-- 铰 -->
  <circle cx="390" cy="48" r="5" fill="white" stroke="#f59e0b" stroke-width="2"/>
  <!-- 转角箭头 -->
  <path d="M 375,55 A 15,15 0 0,1 380,42" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="380,42 376,47 383,47" fill="#ef4444"/>
  <path d="M 405,55 A 15,15 0 0,0 400,42" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="400,42 397,47 404,47" fill="#ef4444"/>
  <!-- 基线 -->
  <line x1="290" y1="70" x2="490" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- 竖距标注 -->
  <line x1="390" y1="48" x2="390" y2="70" stroke="#4f46e5" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="405" y="62" font-size="11" font-weight="600" fill="#4f46e5">l/4=2m</text>
  <!-- 填充 -->
  <polygon points="290,70 390,48 490,70" fill="rgba(79,70,229,0.1)"/>
  <!-- 正号 -->
  <text x="390" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">＋</text>
  
  <!-- (c) FQC影响线 -->
  <text x="130" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">(c) F<tspan font-size="9" dy="2">QC</tspan><tspan dy="-2"> 影响线</tspan></text>
  <!-- 基线 -->
  <line x1="30" y1="220" x2="230" y2="220" stroke="#94a3b8" stroke-width="1"/>
  <!-- 左段 -1/2 -->
  <line x1="30" y1="220" x2="125" y2="220" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="135" y1="220" x2="230" y2="220" stroke="#ef4444" stroke-width="2.5"/>
  <!-- 右段 +1/2 (偏移显示) -->
  <rect x="30" y="220" width="95" height="25" fill="rgba(239,68,68,0.1)" stroke="none"/>
  <rect x="135" y="195" width="95" height="25" fill="rgba(16,185,129,0.1)" stroke="none"/>
  <line x1="30" y1="245" x2="125" y2="245" stroke="#ef4444" stroke-width="2"/>
  <line x1="135" y1="195" x2="230" y2="195" stroke="#10b981" stroke-width="2"/>
  <!-- 竖线连接 -->
  <line x1="30" y1="220" x2="30" y2="245" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="125" y1="220" x2="125" y2="245" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="135" y1="195" x2="135" y2="220" stroke="#10b981" stroke-width="1.5"/>
  <line x1="230" y1="195" x2="230" y2="220" stroke="#10b981" stroke-width="1.5"/>
  <!-- 滑动支座符号 -->
  <rect x="124" y="215" width="12" height="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  <!-- 标注 -->
  <text x="77" y="260" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">−1/2</text>
  <text x="183" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">+1/2</text>
  <!-- 突变箭头 -->
  <text x="130" y="215" text-anchor="middle" font-size="10" fill="#f59e0b">↕ 突变</text>
  
  <!-- 位移示意 -->
  <text x="390" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">(d) 机动法示意</text>
  <!-- 左半段下移 -->
  <line x1="290" y1="210" x2="385" y2="230" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="6,3"/>
  <!-- 右半段上移 -->
  <line x1="395" y1="230" x2="490" y2="210" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="6,3"/>
  <!-- 铰 -->
  <circle cx="390" cy="230" r="5" fill="white" stroke="#f59e0b" stroke-width="2"/>
  <!-- 基线 -->
  <line x1="290" y1="210" x2="490" y2="210" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- 位移箭头 -->
  <line x1="340" y1="210" x2="340" y2="222" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="340,222 337,217 343,217" fill="#ef4444"/>
  <line x1="440" y1="210" x2="440" y2="198" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="440,198 437,203 443,203" fill="#10b981"/>
  <text x="340" y="240" text-anchor="middle" font-size="10" fill="#ef4444">↓ δ/2</text>
  <text x="440" y="192" text-anchor="middle" font-size="10" fill="#10b981">↑ δ/2</text>
</svg>
