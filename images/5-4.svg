<svg viewBox="0 0 520 240" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- 题4：最不利荷载位置 -->
  <text x="260" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">题4：最不利荷载位置（l=16m，截面K距A端6m）</text>
  
  <!-- (a) 结构图 -->
  <text x="130" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">(a) 结构与荷载</text>
  
  <!-- 梁 -->
  <line x1="40" y1="80" x2="440" y2="80" stroke="#334155" stroke-width="3"/>
  
  <!-- A支座 -->
  <polygon points="40,80 28,102 52,102" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="22" y1="105" x2="58" y2="105" stroke="#334155" stroke-width="2"/>
  <line x1="26" y1="105" x2="22" y2="112" stroke="#334155" stroke-width="1.2"/>
  <line x1="34" y1="105" x2="30" y2="112" stroke="#334155" stroke-width="1.2"/>
  <line x1="42" y1="105" x2="38" y2="112" stroke="#334155" stroke-width="1.2"/>
  <line x1="50" y1="105" x2="46" y2="112" stroke="#334155" stroke-width="1.2"/>
  <line x1="58" y1="105" x2="54" y2="112" stroke="#334155" stroke-width="1.2"/>
  <text x="40" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">A</text>
  
  <!-- B支座 -->
  <polygon points="440,80 428,102 452,102" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="440" cy="105" r="3" fill="white" stroke="#334155" stroke-width="1.5"/>
  <line x1="422" y1="108" x2="458" y2="108" stroke="#334155" stroke-width="2"/>
  <line x1="426" y1="108" x2="422" y2="115" stroke="#334155" stroke-width="1.2"/>
  <line x1="434" y1="108" x2="430" y2="115" stroke="#334155" stroke-width="1.2"/>
  <line x1="442" y1="108" x2="438" y2="115" stroke="#334155" stroke-width="1.2"/>
  <line x1="450" y1="108" x2="446" y2="115" stroke="#334155" stroke-width="1.2"/>
  <line x1="458" y1="108" x2="454" y2="115" stroke="#334155" stroke-width="1.2"/>
  <text x="440" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">B</text>
  
  <!-- K截面 -->
  <line x1="190" y1="68" x2="190" y2="92" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,2"/>
  <text x="190" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#f59e0b">K</text>
  
  <!-- 三个集中力 -->
  <!-- FP1=30kN -->
  <line x1="115" y1="30" x2="115" y2="78" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="115,78 110,68 120,68" fill="#ef4444"/>
  <text x="115" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#ef4444">30kN</text>
  
  <!-- FP2=50kN -->
  <line x1="190" y1="22" x2="190" y2="78" stroke="#ef4444" stroke-width="3"/>
  <polygon points="190,78 184,66 196,66" fill="#ef4444"/>
  <text x="190" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#ef4444">50kN</text>
  
  <!-- FP3=30kN -->
  <line x1="290" y1="30" x2="290" y2="78" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="290,78 285,68 295,68" fill="#ef4444"/>
  <text x="290" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#ef4444">30kN</text>
  
  <!-- 间距标注 -->
  <line x1="115" y1="95" x2="190" y2="95" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="115" y1="90" x2="115" y2="100" stroke="#3b82f6" stroke-width="1"/>
  <line x1="190" y1="90" x2="190" y2="100" stroke="#3b82f6" stroke-width="1"/>
  <text x="152" y="108" text-anchor="middle" font-size="10" fill="#3b82f6">3m</text>
  
  <line x1="190" y1="95" x2="290" y2="95" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="290" y1="90" x2="290" y2="100" stroke="#3b82f6" stroke-width="1"/>
  <text x="240" y="108" text-anchor="middle" font-size="10" fill="#3b82f6">4m</text>
  
  <!-- 跨度标注 -->
  <line x1="40" y1="145" x2="190" y2="145" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="40" y1="139" x2="40" y2="151" stroke="#64748b" stroke-width="1"/>
  <line x1="190" y1="139" x2="190" y2="151" stroke="#64748b" stroke-width="1"/>
  <text x="115" y="160" text-anchor="middle" font-size="10" fill="#64748b">6m</text>
  
  <line x1="190" y1="145" x2="440" y2="145" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="440" y1="139" x2="440" y2="151" stroke="#64748b" stroke-width="1"/>
  <text x="315" y="160" text-anchor="middle" font-size="10" fill="#64748b">10m</text>
  
  <!-- (b) MK影响线 -->
  <text x="390" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">(b) M<tspan font-size="9" dy="2">K</tspan><tspan dy="-2"> 影响线</tspan></text>
  
  <!-- 基线 -->
  <line x1="290" y1="210" x2="490" y2="210" stroke="#94a3b8" stroke-width="1"/>
  
  <!-- 三角形影响线 -->
  <polygon points="290,210 390,160 490,210" fill="rgba(79,70,229,0.12)" stroke="#4f46e5" stroke-width="2"/>
  
  <!-- 顶点标注 -->
  <line x1="390" y1="160" x2="390" y2="210" stroke="#4f46e5" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="400" y="180" font-size="11" font-weight="600" fill="#4f46e5">3.75m</text>
  
  <!-- 荷载放在影响线上 -->
  <circle cx="352" cy="179" r="3" fill="#ef4444"/>
  <text x="340" y="175" font-size="9" fill="#ef4444">30</text>
  <circle cx="390" cy="160" r="3.5" fill="#ef4444"/>
  <text x="380" y="155" font-size="9" fill="#ef4444">50</text>
  <circle cx="440" cy="185" r="3" fill="#ef4444"/>
  <text x="448" y="182" font-size="9" fill="#ef4444">30</text>
</svg>
